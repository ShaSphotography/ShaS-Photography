  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background: #1a1a1a; /* Dark grey background */
      color: white;
      text-align: center;
    }
    header {
      padding: 50px 20px 20px;
    }
    header h1 {
      font-size: 3rem;
      margin-bottom: 1px;
      animation: fadeInDown 1.2s ease-in-out;
    }
    header p {
      font-size: 1.2rem;
      color: #ccc;
      margin-top: 1px;
      animation: fadeInUp 1.5s ease-in-out;
    }
    .links {
      margin: 10px auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center; /* Center horizontally */
      gap: 15px;
    }
    .links a {
      display: flex;
      align-items: center; /* vertically center icon and text */
      justify-content: flex-start; /* icon on left, text next */
      gap: 15px; /* space between icon and text */
      width: 120px; /* box width */
      padding: 10px 80px; /* padding for icon and text */
      background: rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      text-decoration: none;
      color: white;
      font-size: 1.1rem;
      font-weight: 500;
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
    }
    .links a:hover {
      background: linear-gradient(135deg, #FFD700, #FFA500); /* Gradient Gold */
      color: black;
      transform: translateY(-5px) scale(1.05);
      box-shadow: 0px 8px 25px rgba(255, 215, 0, 0.6);
    }
    .links a svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      display: block;
      transition: transform 0.4s ease;
    }
    .links a:hover svg {
      transform: rotate(15deg) scale(1.2);
    }
    footer {
      margin: 50px 0 20px;
      font-size: 0.9rem;
      color: #aaa;
      animation: fadeIn 2s ease-in-out;
    }

    /* Animations */
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
